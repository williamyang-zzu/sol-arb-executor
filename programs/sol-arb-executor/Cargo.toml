[package]
name = "sol-arb-executor"
version = "0.1.0"
description = "Atomic PumpSwap/Meteora DLMM arbitrage route executor"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "sol_arb_executor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = [
    "associated_token",
    "token",
    # Anchor SPL 0.31.1's idl-build module references token_interface
    # unconditionally, so token_2022 is required to generate the IDL even
    # though this program rejects Token-2022 accounts at runtime.
    "token_2022",
] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
] }
